[project]
name = "boston-eval-harness"
version = "0.0.1"
description = "Eval harness for statistical claim verification over Boston open data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    # XLSX data dictionaries and the offense-code table. Reads into Polars via the
    # Arrow C stream interface, so no pyarrow.
    "fastexcel>=0.21",
    # BPD's weekly report PDFs (SSRS-rendered tables with cell borders).
    "pdfplumber>=0.11",
    "sqlglot>=25.0",
    # 1.43.1 is yanked; skip it explicitly rather than letting a resolver land
    # there on a machine with a different cache.
    "polars>=1.0,!=1.43.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claims", "env", "harness", "ingest", "specs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
