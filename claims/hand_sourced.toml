# Hand-sourced claims: published, dated, attributable statements about Boston crime.
#
# Built into claims/corpus/hand.jsonl by `python -m claims.hand_claims`.
#
# Sourcing rule: a claim is here only if it was read on the source page itself.
# Every page below was fetched on 2026-09-23, and its publication date and the key
# phrases each claim rests on were confirmed in the raw HTML (not from search
# snippets or summaries). Paywalled or bot-blocked pages whose text could not be
# read are left out, even when search results quoted them (Axios, 2026-08-14).
#
# Paraphrase, don't quote. Attribute to organizations and roles. Claims the open
# data cannot check (cross-city rankings, arrests, "since 1957") are kept: they
# are the unverifiable class, not rejects.

