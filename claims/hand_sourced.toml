# City of Boston end-of-year public safety update, 2025-12-19

[[claim]]
id = "hand-bostongov-20251219-homicides-vs-5yr"
source = "bostongov-2025-12-19"
speaker = "Boston Police Department (Commissioner)"
paraphrase = "The police commissioner said Boston's 2025 homicides were 16% below the five-year average."
measure = { family = "part_one_offense", name = "Homicide" }
geography = { level = "citywide" }
window = { kind = "vs_five_year_average", current_start = 2025-01-01, current_end = 2025-12-19 }
assertion = { kind = "change", direction = "down", stated_pct = -16.0 }
stated = { printed_pct = -16.0 }
cluster = "homicide:citywide:2025"

[[claim]]
id = "hand-bostongov-20251219-shooting-victims-vs-5yr"
source = "bostongov-2025-12-19"
speaker = "City of Boston (Mayor)"
paraphrase = "The city said 2025 shooting victims were at a historic low, down more than 30% from the five-year average."
measure = { family = "shootings", name = "Shooting victims", shooting_measure = "victims_struck" }
geography = { level = "citywide" }
window = { kind = "vs_five_year_average", current_start = 2025-01-01, current_end = 2025-12-19 }
assertion = { kind = "change", direction = "down", stated_pct = -30.0, bound = "at_least" }
cluster = "shooting-victims:citywide:2025"
notes = ["'Historic low' is a rank claim across all tracked years; only the five-year comparison is encoded here."]

[[claim]]
id = "hand-bostongov-20251219-gunfire-vs-5yr"
source = "bostongov-2025-12-19"
speaker = "City of Boston (Mayor)"
paraphrase = "The city said 2025 gunfire incidents were at a historic low, down more than 30% from the five-year average."
measure = { family = "gunfire", name = "Incidents of gunfire" }
geography = { level = "citywide" }
window = { kind = "vs_five_year_average", current_start = 2025-01-01, current_end = 2025-12-19 }
assertion = { kind = "change", direction = "down", stated_pct = -30.0, bound = "at_least" }
cluster = "gunfire:citywide:2025"
notes = ["The open data's closest measure is the crime table's SHOOTING flag, which changed meaning in 2019 (LIM-SHOOTINGS-VS-VICTIMS)."]

